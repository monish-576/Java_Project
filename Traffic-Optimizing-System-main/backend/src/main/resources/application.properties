# Server
server.port=8080

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/ambulance_routing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Abhi431@rewa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC
spring.jdbc.template.query-timeout=30
# Allow app startup even if database is unavailable
spring.datasource.hikari.initialization-fail-timeout=-1

# Logging
logging.level.com.ambulance=DEBUG
logging.level.org.springframework=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
